services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
      POSTGRES_DB: smartcampus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartcampus:smartcampus@db:5432/smartcampus
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
